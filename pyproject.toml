[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoopt"
version = "0.1.0"
description = "Checkpointed autonomous algorithm engineer framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autoopt = "autoopt.cli:main"

[tool.setuptools.packages.find]
include = ["autoopt*"]
